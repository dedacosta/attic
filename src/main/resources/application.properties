spring.application.name=attic

# SQLite database file; the parent directory is created on startup
attic.database.file=data/attic.db
spring.datasource.url=jdbc:sqlite:${attic.database.file}?journal_mode=WAL&busy_timeout=5000&foreign_keys=true

# Schema migrations live in db/migration. A database created before Flyway was added
# already has the V1 schema, so it is marked as V1 and only newer migrations run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Pictures are stored as files; defaults to a "pictures" directory next to the database file
#attic.picture.dir=data/pictures
attic.picture.max-size=10MB

# Session cookie: not readable by scripts, not sent along with requests from other sites
server.servlet.session.cookie.same-site=lax
